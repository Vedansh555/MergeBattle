      x.beginPath();x.arc(u.x+30,u.y+26,19,0,6.28);x.fillStyle=ok?'rgba(255,255,255,.9)':'rgba(255,255,255,.3)';x.fill();
      if(lab==='POWER'){x.save();x.translate(u.x+30,u.y+26);x.scale(.78,.78);cardIcon('zap',0,0);x.restore()}else{drop(u.x+30,u.y+30,10,lg(u.y+18,u.y+40,'#c9a8ff','#7a4de0'))}

// ---------- input ----------
function pos(e){return{x:(e.clientX*dpr-ox)/sc,y:(e.clientY*dpr-oy)/sc}}
const inR=(p,rx,ry,rw,rh)=>p.x>=rx&&p.x<=rx+rw&&p.y>=ry&&p.y<=ry+rh;
const inRect=(p,r)=>inR(p,r.x,r.y,r.w,r.h);
function buyUp(which){const lv=which===1?powLv:elxLv,c=upCost(lv);if(coins<c){toast('Need more coins!','#e0523f');return}coins-=c;if(which===1)powLv++;else elxLv++;sfx.disc();floatT(which===1?'POWER UP!':'ELIXIR UP!',180,topY+230,'#6bd08a');save()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();gestured=true;try{audio()}catch(_){}if(paused)return;const p=pos(e),prepY=topY+72;idle=0;
  if(phase==='menu'){sfx.click();next();return}
  if(FEAT.mute&&inR(p,8,SAFE_T+42,40,32)){userMute=!userMute;applyPause();return}
  if(FEAT.skip&&phase==='prep'&&tut<3&&inR(p,298,topY+8,54,24)){tut=3;save();sfx.click();return}
  if((phase==='won'||phase==='lost')&&sT>(FEAT.fast?.12:.3)){const P=panel();
    if(wave>=3&&inRect(p,P.up1)){buyUp(1);return}if(wave>=3&&inRect(p,P.up2)){buyUp(2);return}
    if(rewardedOk()&&!rewUsed&&inRect(p,P.ad)){const win=phase==='won',amt=win?bonusGot:40+wave*12;showRewarded(win?'double_coins':'free_coins',()=>{rewUsed=true;coins+=amt;floatT('+'+amt,180,P.y+190,'#b8860b');save()});return}
    if(inRect(p,P.go)||!inR(p,P.x,P.y,P.w,P.h)){sfx.click();next()}return}
  if(phase==='prep'||phase==='fight'){
    for(let i=0;i<4;i++)if(inR(p,CX(i),btnY,CW,72)){
      if(phase==='prep'){toast('Press Start Wave to begin!','#5ccfb4');sfx.click();return}
      cardDrag={i,px:p.x,py:p.y,sx:p.x,sy:p.y};try{cv.setPointerCapture(e.pointerId)}catch(_){}sfx.card();return
    }
  }
  if(phase==='prep'){const _wy=topY+(baseY-topY)*.44;if(inR(p,62,_wy-37,236,74)){sfx.click();startWave();return}}
  if((phase==='prep'||phase==='fight')&&!drag){let bu=null,bd=32;for(const u of units){const d=Math.hypot(u.x-p.x,u.y-p.y);if(d<bd){bd=d;bu=u}}if(bu){drag={u:bu,px:p.x,py:p.y};try{cv.setPointerCapture(e.pointerId)}catch(_){}}}});
cv.addEventListener('pointermove',e=>{if(cardDrag){e.preventDefault();const p=pos(e);cardDrag.px=p.x;cardDrag.py=p.y;return}if(!drag)return;e.preventDefault();const p=pos(e);drag.px=p.x;drag.py=p.y});
function release(e){
  if(cardDrag){const c=cardDrag;cardDrag=null;const p=pos(e);useCard(c.i,p.x,p.y,Math.hypot(p.x-c.sx,p.y-c.sy)<=14);return}
  if(!drag)return;const p=pos(e),u=drag.u;drag=null;
  let tg=null,bd=36;for(const o of units){if(o===u)continue;const d=Math.hypot(o.x-p.x,o.y-(p.y-14));if(d<bd){bd=d;tg=o}}
  if(tg&&tg.lv===u.lv&&u.lv<MAXLV){units.splice(units.indexOf(u),1);tg.lv++;tg.mhp=palHp(tg.lv);tg.hp=tg.mhp;tg.maxLife=palLife(tg.lv);tg.life=tg.maxLife;tg.expired=false;tg.pop=.35;burst(tg.x,tg.y,COLORS[tg.lv-2],18);ring(tg.x,tg.y,COLORS[tg.lv-2]);ring(tg.x,tg.y,'#fff');floatT('Lv '+tg.lv+'!',tg.x,tg.y-30,'#6bd08a');sfx.merge(tg.lv-1);energy=Math.min(10,energy+.25);
    if(tg.lv>topLv){topLv=tg.lv;ring(tg.x,tg.y,'#ffd23f');burst(tg.x,tg.y,'#ffd23f',26);coins+=topLv*10;sfx.disc()}save();return}
  u.x=Math.max(40,Math.min(320,p.x));u.y=Math.max(zoneT,Math.min(baseY-14,p.y-14));u.dy=baseY-u.y;nudge(u);u.pop=.25;sfx.click();save()}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',()=>{drag=null;cardDrag=null});
addEventListener('keydown',e=>{if(paused)return;if(FEAT.mute&&(e.key==='m'||e.key==='M')){userMute=!userMute;applyPause();return}if(FEAT.keys&&e.key>='1'&&e.key<='4'&&(phase==='prep'||phase==='fight')){useCard(+e.key-1,180,topY+160,true);return}if(e.key===' '||e.key==='Enter'){if(phase==='menu'||((phase==='won'||phase==='lost')&&sT>(FEAT.fast?.12:.3)))next();else if(phase==='prep')startWave()}});

addEventListener('blur',()=>{if(FEAT.blur){blurred=true;applyPause()}});addEventListener('focus',()=>{blurred=false;applyPause()});

// ---------- loop ----------
resetUnits();
let last=performance.now();
function frame(n){const dt=Math.min(.05,(n-last)/1e3);last=n;if(!paused)update(dt);draw();musicTick();
